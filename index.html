<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>考研英语上岸模拟器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(1200px 800px at 50% -100px,#f6dfe5,#EDD1D8 60%,#e7c3cd);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#4a2b35;min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:18px 14px 40px}
@keyframes cardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.t1{font-size:20px;font-weight:700;font-family:"KaiTi","STKaiti",serif;letter-spacing:1px}
.t2{font-size:11.5px;color:#8a6470;margin-top:2px}
.pill{background:#c2708c;color:#fff;font-size:12px;padding:5px 10px;border-radius:999px;font-weight:600}
.pg{height:5px;background:rgba(255,255,255,.55);border-radius:99px;overflow:hidden;margin:0 0 12px}
.pg i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#e0a3b5,#c2708c);transition:width .4s}
.card{background:#fff;border-radius:18px;padding:18px 16px;margin-bottom:14px;box-shadow:0 4px 16px rgba(194,112,140,.14);animation:cardIn .35s ease}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;color:#fff;background:#c2708c;font-family:inherit;cursor:pointer;transition:transform .12s,box-shadow .12s;box-shadow:0 3px 10px rgba(194,112,140,.3)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:#c2708c;border:1.5px solid #e5bfc9;box-shadow:none}
.opt{display:block;width:100%;text-align:left;border:1.5px solid #f0dbe2;background:#fff;border-radius:13px;padding:13px 14px;font-size:14.5px;margin-bottom:9px;color:#4a2b35;font-family:inherit;cursor:pointer;line-height:1.45;transition:all .15s}
.opt:active{background:#fbeef2;transform:scale(.98)}
.opt:hover{border-color:#e0a3b5}
.opt b{color:#c2708c}
.row{display:flex;gap:10px;margin-top:10px}
.stbar{margin:7px 0}
.stl{display:flex;justify-content:space-between;font-size:12px;color:#8a6470;margin-bottom:3px}
.stl b{color:#4a2b35}
.bar{height:9px;background:#f6e7ec;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.tag{display:inline-block;background:#fbeef2;color:#c2708c;font-size:11px;padding:3px 9px;border-radius:99px;margin-right:6px;margin-top:8px}
.tag.en{background:#eef3fb;color:#5b7fb9}
.tag.fix{background:#fdf3e0;color:#c08a2d}
.tag.mini{background:#eaf5ee;color:#4d9e6a}
.tag.line{background:#f3ecfa;color:#8a63b8}
.ev{font-size:16px;font-weight:700;line-height:1.4}
.desc{font-size:14.5px;line-height:1.65;color:#5d414b;margin:9px 0 14px}
.res{font-size:14px;line-height:1.6;color:#8a5a68;background:#fbeef2;border-radius:12px;padding:11px 13px;margin-bottom:12px}
.foot{font-size:11px;color:#a98492;text-align:center;margin-top:16px;line-height:1.6}
.delta{font-size:12px;font-weight:700;margin-left:8px}
.up{color:#4d9e6a}.down{color:#c25b5b}
.qw{font-size:24px;font-weight:700;font-family:Georgia,serif}
.ph{font-size:13px;color:#8a6470;margin-top:2px}
.score{display:flex;justify-content:space-around;margin:12px 0}
.sc{text-align:center}
.sc b{font-size:22px;display:block}
.sc span{font-size:11px;color:#8a6470}
.emoji-big{font-size:52px;text-align:center;margin:6px 0;animation:pop .4s ease}
.endt{font-size:24px;font-weight:800;text-align:center;font-family:"KaiTi","STKaiti",serif;letter-spacing:2px}
.fate{font-size:14px;line-height:1.7;text-align:center;color:#5d414b;margin:10px 0}
.cd{font-size:11px;color:#fff;background:linear-gradient(90deg,#c2708c,#e0a3b5);border-radius:99px;padding:3px 9px;font-weight:700;letter-spacing:.5px}
canvas{width:100%;border-radius:14px;margin-top:10px;display:none}
</style>
</head>

<div id="app"></div>
<script>
/* ================== 考研英语上岸模拟器 · v2 ==================
   剧情加深：4 条剧情线（室友 / 妈妈 / 研友 / 卷王哥），各 3 幕，
   第一幕的选择写进 flags，后面两幕的剧情会呼应你当时的选择。
   玩法加深：错题本反杀（答错的词根题 5 天后回来再考）、
   日常小抉择、剧情后半幕嵌入词根题突袭。
   卖相：卡片入场动效 / 倒计时 / 进度条 / 分享图升级。 */

var app = document.getElementById("app");
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

/* ---------- 考研英语题（词根族，答错进错题本，5 天后再考） ---------- */
var ENQ = [
 {w:"prospect", ph:"/ˈprɒspekt/", o:["前景；展望","繁荣","提议","期望值"], a:0, tip:"spect＝看。pro（向前）＋spect（看）→ 往前看的东西＝「前景」。考研阅读里 prospect of doing＝做某事的前景。"},
 {w:"contradict", ph:"/ˌkɒntrəˈdɪkt/", o:["与…矛盾；反驳","口述","预测","反对投票"], a:0, tip:"dict＝说。contra（相反）→ 反着说＝「矛盾」。作者态度题最爱：contradict the previous view。"},
 {w:"transfer", ph:"/trænsˈfɜː/", o:["转移；转乘","改革","透明","变形"], a:0, tip:"fer＝带、搬。trans（过去）→ 搬过去＝「转移」。transfer to another school＝转学。"},
 {w:"inspect", ph:"/ɪnˈspekt/", o:["检查；视察","尊重","注视","期待"], a:0, tip:"spect＝看。in（往里）→ 看进去＝「检查」。inspect the factory＝视察工厂。"},
 {w:"durable", ph:"/ˈdjʊərəbl/", o:["耐用的","期间","重复的","持续的时间"], a:0, tip:"dur＝持久 → 能持久＝「耐用」。durable goods＝耐用品，真题阅读高频。"},
 {w:"maintain", ph:"/meɪnˈteɪn/", o:["维持；坚称","放弃","反对","遗留"], a:0, tip:"tain＝拿住。main（手）→ 用手拿住＝「维持」。maintain that…＝坚持认为，作者观点题信号词。"},
 {w:"submit", ph:"/səbˈmɪt/", o:["提交；服从","转让","容忍","传输"], a:0, tip:"mit/miss＝送。sub（下面）→ 送到上级手里＝「提交」。submit a paper＝交论文。"},
 {w:"compress", ph:"/kəmˈpres/", o:["压缩","压力","印象","表达"], a:0, tip:"press＝压。com（一起）→ 往一起压＝「压缩」。compressed schedule＝压缩的日程。"},
 {w:"reform", ph:"/rɪˈfɔːm/", o:["改革；改良","执行","信息","正规"], a:0, tip:"form＝形状。re（重新）→ 重新塑形＝「改革」。education reform＝教育改革。"},
 {w:"export", ph:"/ɪkˈspɔːt/", o:["出口","进口","输送","爆发"], a:0, tip:"port＝搬运。ex（向外）→ 搬出去＝「出口」。反义 import（im＝向内）。"},
 {w:"interrupt", ph:"/ˌɪntəˈrʌpt/", o:["打断","休息","腐败","相互"], a:0, tip:"rupt＝破裂。inter（中间）→ 从中间破开＝「打断」。interrupt the silence。"},
 {w:"inspire", ph:"/ɪnˈspaɪə/", o:["鼓舞；启发","呼吸","出汗","渴望"], a:0, tip:"spir＝呼吸。in（吸进）→ 把气吹进去＝「鼓舞」。be inspired by＝受…启发。"},
 {w:"prevent", ph:"/prɪˈvent/", o:["阻止","发明","事件","走向"], a:0, tip:"vent＝来。pre（提前）→ 提前赶到＝「阻止」。prevent…from doing＝阻止做某事。"},
 {w:"insist", ph:"/ɪnˈsɪst/", o:["坚持说；坚决要求","存在","抵抗","站立"], a:0, tip:"sist＝站。in（上面）→ 站在原地不动＝「坚持」。insist on＝坚决要求。"},
 {w:"betray", ph:"/bɪˈtreɪ/", o:["背叛；泄露","燃烧","运送","预言"], a:0, tip:"tray＝交付 → 把秘密交出去＝「背叛」。betray one's trust＝辜负信任。"},
 {w:"suspend", ph:"/səˈspend/", o:["暂停；悬挂","花费","依赖","回应"], a:0, tip:"pend＝悬挂 → 吊在半空＝「暂停」。suspended sentence＝缓刑（真题出现过）。"},
 {w:"conclusion", ph:"/kənˈkluːʒn/", o:["结论；结局","封闭","包含","祝贺"], a:0, tip:"clud/clus＝关闭。con（一起）→ 一起关上门＝「定稿收尾」＝「结论」。in conclusion＝总之，作文万能开场。"},
 {w:"reflect", ph:"/rɪˈflekt/", o:["反映；反思","弯曲","刷新","回复"], a:0, tip:"flect＝弯曲。re（回）→ 光弯回来＝「反射」→ 引申「反思」。reflect on＝反思，阅读态度题高频词。"},
 {w:"transmit", ph:"/trænsˈmɪt/", o:["传输；传播","移植","翻译","变换"], a:0, tip:"mit/miss＝送。trans（跨过去）→ 送过去＝「传输」。transmit signals＝传输信号，科技说明文常客。"},
 {w:"perceive", ph:"/pəˈsiːv/", o:["感知；认为","接受","欺骗","追求"], a:0, tip:"ceive＝拿、取。per（彻底）→ 彻底收到心里＝「感知」。perceive A as B＝把 A 看作 B，阅读高频。"}
];

   {l:"连夜换目标院校", f:{x:3,p:-4}, r:"选择大于努力——你第一次信了这句话。"},
   {l:"假装没看见", f:{x:-5}, r:"不看它就不存在吗？不。但今晚能睡个好觉。"} ]},
 {r:13, m:"9月", e:"📝 预报名开始了", d:"研友群突然安静，然后有人冒泡：『你报名没？？』", c:[

/* ---------- 剧情线开场（前 4 个动态轮次必出，选择写入 flags） ---------- */
var OPENERS = [

function dateInfo(r){
  var off = Math.round(r / (TOTAL - 1) * 295);
  var d = new Date(2026, 2, 1 + off);
  var left = 295 - off;
  return {date: (d.getMonth() + 1) + "月" + d.getDate() + "日", left: left};
}
function monthOf(r){ return dateInfo(r).date.replace(/日/, "") + ""; }

/* ---------- 渲染 ---------- */
function header(r){

  return '<div class="top"><div><div class="t1">考研英语上岸模拟器</div><div class="t2">' + esc(di.date) + " · 你的考研命运行中</div></div>"

    + '<div class="pg"><i style="width:' + Math.round((r + 1) / TOTAL * 100) + '%"></i></div>';
}
function bars(){

  function bar(name, v, c){

  }
  return bar("🙂 心态", s.x, "#e8a33d") + bar("📈 进度", s.p, "#c2708c") + bar("💇 头发", s.h, "#7f8fb5") + bar("💰 存款", s.m, "#5da27a");

function deltaHTML(f){
  var map = {x:"心态", p:"进度", h:"头发", m:"存款"};
  var out = "";
  for (var k in f){ if (k === "quit") continue;
    var v = f[k]; if (!v) continue;
    out += '<span class="delta ' + (v > 0 ? "up" : "down") + '">' + map[k] + (v > 0 ? "+" : "") + v + "</span> ";
  }
  return out;
}
function applyF(f){
  if (f.quit) return;
  S.st.x = clamp(S.st.x + (f.x || 0), 0, 100);
  S.st.p = clamp(S.st.p + (f.p || 0), 0, 100);

/* ---------- 排卡：10 里程碑 + 4 剧情开场 + 8 剧情后续 + 9 填充 ---------- */
function buildQueue(){
  var g = shuffle(EVENTS.slice()), q = shuffle(ENQ.slice()), m = shuffle(MINIS.slice()), fix = FIX.slice();
  S.flags = {}; S.spare = g.slice(); S.pendingQ = null;
  var gi = 0, ei = 0, mi = 0, c = 0;
  /* 剧情线卡位：开场 r=1,2,3,4；第二幕 r=9,12,15,18；第三幕 r=21,23,25,27 */
  var SLOT_OPEN = [1,2,3,4], SLOT_MID = [9,12,15,18], SLOT_END = [21,23,25,27];
  S.queue = [];
  for (var r = 0; r < TOTAL; r++){
    if (fix.length && r === fix[0].r){ S.queue.push({ ev: fix.shift(), fix: 1 }); continue; }
    var oi = SLOT_OPEN.indexOf(r);
    if (oi >= 0){ S.queue.push({ ev: OPENERS[oi].ev, opener: oi }); continue; }
    var mid = SLOT_MID.indexOf(r);
    if (mid >= 0){ S.queue.push({ chain: mid, idx: 0 }); continue; }
    var endi = SLOT_END.indexOf(r);
    if (endi >= 0){ S.queue.push({ chain: endi, idx: 1 }); continue; }
    /* 填充：en / ev / mini 轮转 */
    var type;
    if (c % 4 === 1) type = "mini";
    else if (c % 4 === 2) type = "ev";
    else type = "en";
    c++;
    if (type === "en" && ei >= q.length) type = "ev";
    if (type === "ev" && gi >= g.length) type = (mi < m.length ? "mini" : "en");
    if (type === "mini" && mi >= m.length) type = "en";
    if (type === "en"){ S.queue.push({ en: q[ei] }); ei++; }
    else if (type === "mini"){ S.queue.push({ mini: m[mi] }); mi++; }
    else { S.queue.push({ ev: g[gi] }); gi++; }
  }
}

function chainEv(item){
  var line = CHAINS[item.chain], ev = line.evs[item.idx];
  var flagVal = S.flags[line.flag];
  var d = ev.vd && flagVal && ev.vd[flagVal] ? ev.vd[flagVal] : (ev.vd && ev.vd._ ? ev.vd._ : ev.d);
  return { e: ev.e, d: d, c: ev.c, q: ev.q, qd: ev.qd, lineName: ["室友线","妈妈线","研友线","卷王线"][item.chain] };
}

function renderCard(){
  if (S.round >= TOTAL){ return renderExam(); }
  var item = S.queue[S.round];
  var h = header(S.round);
  h += '<div class="card">' + bars() + "</div>";
  if (item.en || item.redo){
    var q = item.en;
    item.ord = shuffle([0,1,2,3]);
    h += '<div class="card"><span class="tag ' + (item.redo ? "fix" : "en") + '">' + (item.redo ? "🔁 错题本反杀 · 这词又来了" : "考研英语 · 词根题") + "</span>";
    h += '<div style="margin-top:10px"><div class="qw">' + q.w + '</div><div class="ph">' + q.ph + " —— 考研阅读里，它是啥意思？</div></div>";
    h += '<div style="margin-top:12px">';
    for (var i=0;i<item.ord.length;i++) h += '<button class="opt" data-q="' + i + '">' + esc(q.o[item.ord[i]]) + "</button>";
    h += "</div></div>";
  } else if (item.mini){
    var mv = item.mini;
    h += '<div class="card"><span class="tag mini">日常小抉择</span>';
    h += '<div class="ev" style="margin-top:8px">' + esc(mv.e) + '</div><div class="desc">' + esc(mv.d) + "</div>";
    for (var a=0;a<mv.c.length;a++) h += '<button class="opt" data-c="' + a + '">' + esc(mv.c[a].l) + "</button>";
    h += "</div>";
  } else if (item.chain !== undefined){
    var cv = chainEv(item);
    h += '<div class="card"><span class="tag line">剧情 · ' + esc(cv.lineName) + '</span><span class="tag">你的过去正在回响</span>';
    h += '<div class="ev" style="margin-top:8px">' + esc(cv.e) + '</div><div class="desc">' + esc(cv.d) + "</div>";
    for (var b=0;b<cv.c.length;b++) h += '<button class="opt" data-c="' + b + '">' + esc(cv.c[b].l) + "</button>";
    h += "</div>";
  } else {
    var ev = item.ev;
    var tag = item.fix ? '<span class="tag fix">📌 里程碑 · ' + esc(ev.m) + "</span>" : '<span class="tag">' + esc(monthOf(S.round)) + " 事件</span>";
    h += '<div class="card">' + tag;
    h += '<div class="ev" style="margin-top:8px">' + esc(ev.e) + '</div><div class="desc">' + esc(ev.d) + "</div>";
    for (var j=0;j<ev.c.length;j++) h += '<button class="opt" data-c="' + j + '">' + esc(ev.c[j].l) + "</button>";
    h += "</div>";
  }
  h += '<div class="foot">心态归零 / 头发掉光 / 存款花完 → 提前退场</div>';
  app.innerHTML = h;
  app.querySelectorAll("[data-q]").forEach(function(b){ b.onclick = function(){ answerEn(Number(b.getAttribute("data-q"))); }; });
  app.querySelectorAll("[data-c]").forEach(function(b){ b.onclick = function(){ pickEv(Number(b.getAttribute("data-c"))); }; });
}

/* ---------- 英语题判定（含剧情内嵌题） ---------- */
function answerEn(i){
  var item = S.queue[S.round];
  var q = item.en || item.cq;
  var ok = (i === item.ord.indexOf(q.a));
  var h = header(S.round) + '<div class="card">' + bars() + "</div>";
  var tag = item.redo ? "🔁 错题本反杀" : (item.cq ? "剧情 · 词根突袭" : "考研英语 · 词根题");
  h += '<div class="card"><span class="tag ' + (item.redo ? "fix" : "en") + '">' + tag + "</span>";
  h += '<div style="margin-top:10px"><div class="qw">' + q.w + '</div><div class="ph">' + q.ph + "</div></div>";
  if (ok){
    S.right++;
    if (item.redo){ S.revenge++; applyF({x:3,p:2}); h += '<div class="res" style="margin-top:10px">✅ 反杀成功！这个词终于进脑子了。' + deltaHTML({x:3,p:2}) + "</div>"; }
    else { applyF({x:4,p:3}); h += '<div class="res" style="margin-top:10px">✅ 答对了！' + deltaHTML({x:4,p:3}) + "</div>"; }
  } else {
    S.wrong++;
    var willRedo = false;
    if (!item.redo && !item.cq){ scheduleRedo(q); willRedo = true; }
    applyF({x:-4});
    h += '<div class="res" style="margin-top:10px">❌ 答错了（正确答案：' + esc(q.o[q.a]) + "）" + deltaHTML({x:-4}) + (willRedo ? " · <b>已进错题本，它 5 天后会回来</b>" : "") + "</div>";
  }
  h += '<div class="res" style="background:#f4f7fb">💡 ' + esc(q.tip) + "</div>";
  h += nextBtn();
  app.innerHTML = h;
  bindNext();
}
function scheduleRedo(q){
  var pos = S.round + 5;
  while (pos < S.queue.length && S.queue[pos] && (S.queue[pos].fix || S.queue[pos].chain !== undefined || S.queue[pos].opener !== undefined)) pos++;
  if (pos < TOTAL - 1) S.queue.splice(pos, 0, { en: q, redo: 1 });
}

/* ---------- 事件抉择（含开场设 flag / 剧情线 / 小抉择） ---------- */
function pickEv(ci){
  var item = S.queue[S.round];
  var ev = item.chain !== undefined ? chainEv(item) : (item.mini || item.ev);
  var ch = ev.c[ci];
  if (ch.f.quit) return renderQuit();
  if (ch.set){
    var kv = ch.set.split(":");
    S.flags[kv[0]] = kv[1];
  }
  var isLine = item.chain !== undefined;
  var tag = isLine ? '<span class="tag line">剧情 · ' + esc(ev.lineName) + "</span>"
          : (item.mini ? '<span class="tag mini">日常小抉择</span>'
          : (item.opener !== undefined ? '<span class="tag">开局 · 剧情线启动</span>' : '<span class="tag">' + esc(monthOf(S.round)) + " 事件</span>"));
  var h = header(S.round) + '<div class="card">' + bars() + "</div>";
  h += '<div class="card">' + tag;
  h += '<div class="ev" style="margin-top:8px">' + esc(ev.e) + "</div>";
  h += '<div style="margin-top:10px" class="res">' + esc(ch.r) + deltaHTML(ch.f) + "</div>";
  applyF(ch.f);
  S.hist.push(ev.e);
  app.innerHTML = h;
  if (ev.q !== undefined && ev.q !== null && !item.qDone){
    item.qDone = true;
    item.cq = ENQ[ev.q];
    h += '<div class="card"><span class="tag en">剧情 · 词根突袭</span><div style="margin-top:8px" class="desc">' + esc(ev.qd) + "</div>";
    item.ord = shuffle([0,1,2,3]);
    for (var i=0;i<item.ord.length;i++) h += '<button class="opt" data-q="' + i + '">' + esc(item.cq.o[item.ord[i]]) + "</button>";
    h += "</div>";
    app.innerHTML = h;
    app.querySelectorAll("[data-q]").forEach(function(b){ b.onclick = function(){ answerEn(Number(b.getAttribute("data-q"))); }; });
    return;
  }
  h += nextBtn();
  app.innerHTML = h;
  bindNext();
}

  if (S.st.x <= 0) return {e:"😵‍💫", t:"心态崩了", d:"你在自习室哭了三次之后，收拾东西回家了。12 月的考场，你缺席了。"};

}

}

function renderDead(d){
  finishPlay();
  renderEnd(d);
}

/* ---------- 考试日 ---------- */
function renderExam(){
  var g = GOALS[S.goal];
  var eng = clamp(Math.round(35 + S.st.p * 0.45 + S.right * 1.8 + S.revenge * 1.2 + (S.phone === 0 ? 2 : 0)), 22, 92);
  var pol = clamp(Math.round(58 + S.st.x * 0.18), 50, 78);
  var pro = clamp(Math.round(92 + S.st.p * 0.32), 92, 128);
  var total = eng + pol + pro;
  S.exam = {eng:eng, pol:pol, pro:pro, total:total};
  var h = header(TOTAL - 1);
  h += '<div class="card"><div class="emoji-big">🎫</div><div class="endt">考 试 日</div>';
  h += '<div class="fate">第一科：英语。监考老师把你那 P 过的照片看了两眼。<br>交卷铃响的那一刻，你的考研一年结束了。</div>';
  h += '<div class="score"><div class="sc"><b>' + eng + "</b><span>英语</span></div><div class=\"sc\"><b>" + pol + "</b><span>政治</span></div><div class=\"sc\"><b>" + pro + "</b><span>专业课</span></div><div class=\"sc\"><b style=\"color:#c2708c\">" + total + "</b><span>总分</span></div></div>";
  h += '<div style="text-align:center;font-size:12.5px;color:#8a6470">目标线 ' + g.line + " · 词根题答对 " + S.right + " / " + (S.right + S.wrong) + (S.revenge ? " · 错题本反杀 " + S.revenge + " 词" : "") + "</div>";
  h += '<div style="margin-top:14px"><button class="btn" id="fin">查分 →</button></div></div>';
  h += '<div class="foot">估分模型：进度 + 词根题 + 错题反杀 + 命格修正（仅供娱乐）</div>';
  app.innerHTML = h;
  document.getElementById("fin").onclick = function(){ renderScore(total, g); };
}

function renderScore(total, g){
  var end;
  if (total >= g.line + 2) end = {e:"🎉", t:"上岸了", d:"拟录取三个字，比这十一个月所有单词都好看。<br>你给妈妈打电话，第一句是：『妈，你女儿/儿子要读研了。』"};
  else if (total >= g.line - 14) end = {e:"🥲", t:"擦线，调剂", d:"差一点点。调剂系统你填了 37 所学校，<br>最后去了一所你查地图才知道在哪的大学。"};
  else end = {e:"🔁", t:"二战吧", d:"差 " + (g.line - total) + " 分。『二战』两个字写起来很快，<br>读起来，又是三百天。"};
  finishPlay();
  renderEnd(end);
}

/* ---------- 结局 ---------- */
function finishPlay(){
  try {
    var n = Number(localStorage.getItem("ksim_plays") || 0) + 1;
    localStorage.setItem("ksim_plays", String(n));
  } catch(e){}
}

function renderEnd(end){
  var g = GOALS[S.goal];
  var fate = g.name + " · " + HOURS[S.hours].v + " · " + PHONE[S.phone].v;
  var h = '<div class="top"><div><div class="t1">结局</div><div class="t2">你的考研命 · 已结算</div></div><div class="pill">12月21日</div></div>';
  h += '<div class="card"><div class="emoji-big">' + end.e + '</div><div class="endt">' + esc(end.t) + "</div>";
  h += '<div class="fate">' + end.d + "</div>";
  h += '<div style="text-align:center;margin:4px 0 10px"><span class="tag">' + esc(g.l) + "</span><span class=\"tag\">" + fate + "</span></div>";
  h += bars();
  if (!end.quit) h += '<div style="text-align:center;font-size:12.5px;color:#8a6470;margin-top:8px">英语估分 ' + S.exam.eng + " · 词根题答对 " + S.right + " / " + (S.right + S.wrong) + (S.revenge ? " · 错题反杀 " + S.revenge + " 词" : "") + "</div>";
  h += '<div style="margin-top:14px"><button class="btn" id="share">📸 生成分享图</button></div>';
  h += '<div class="row"><button class="btn ghost" id="again">重开一局</button><button class="btn ghost" id="home2">回首页</button></div></div>';
  if (S.hist.length) h += '<div class="card"><div style="font-size:13px;font-weight:700;margin-bottom:6px">你这一年的名场面</div><div style="font-size:12.5px;color:#8a6470;line-height:1.9">' + S.hist.slice(-6).map(esc).join("<br>") + "</div></div>";
  h += '<div class="foot">考研英语上岸模拟器 v2<br>剧情线走向、事件和词根题，每一局都会换</div>';
  app.innerHTML = h;
  document.getElementById("again").onclick = function(){ S.stage = "setup"; renderSetup(); };
  document.getElementById("home2").onclick = renderIntro;
  document.getElementById("share").onclick = function(){ drawShare(end, fate); };
}

/* ---------- 分享图（canvas 1080×1440，长按保存） ---------- */
function drawShare(end, fate){
  var c = document.createElement("canvas");
  c.width = 1080; c.height = 1440;
  var x = c.getContext("2d");
  if (!x) return;
  var grd = x.createLinearGradient(0, 0, 0, 1440);
  grd.addColorStop(0, "#f6dfe5"); grd.addColorStop(1, "#e7c3cd");
  x.fillStyle = grd; x.fillRect(0, 0, 1080, 1440);
  x.fillStyle = "#ffffff"; roundRect(x, 60, 120, 960, 1200, 40); x.fill();
  x.fillStyle = "#c2708c"; x.font = "bold 54px KaiTi, serif"; x.textAlign = "center";
  x.fillText("考研英语上岸模拟器", 540, 250);
  x.fillStyle = "#8a6470"; x.font = "30px sans-serif";
  x.fillText("你的考研命 · 已结算", 540, 310);
  x.font = "150px serif"; x.fillText(end.e, 540, 480);
  x.fillStyle = "#4a2b35"; x.font = "bold 88px KaiTi, serif";
  x.fillText(end.t, 540, 640);
  x.fillStyle = "#5d414b"; x.font = "34px sans-serif";
  wrapText(x, end.d.replace(/<br>/g, " "), 540, 720, 860, 50);
  x.fillStyle = "#fbeef2"; roundRect(x, 140, 850, 800, 160, 30); x.fill();
  x.fillStyle = "#c2708c"; x.font = "bold 36px sans-serif";
  x.fillText(fate, 540, 915);
  if (!end.quit && S.exam){
    var extra = "英语估分 " + S.exam.eng + " · 词根题 " + S.right + " 题";
    if (S.revenge) extra += " · 错题反杀 " + S.revenge;
    x.fillText(extra, 540, 975);
  }
  var s = S.st, bars2 = [["心态", s.x, "#e8a33d"], ["进度", s.p, "#c2708c"], ["头发", s.h, "#7f8fb5"], ["存款", s.m, "#5da27a"]];
  bars2.forEach(function(b, i){
    var y = 1080 + i * 62;
    x.textAlign = "left"; x.fillStyle = "#8a6470"; x.font = "30px sans-serif";
    x.fillText(b[0], 180, y + 12);
    x.fillStyle = "#f6e7ec"; roundRect(x, 300, y - 12, 560, 26, 13); x.fill();
    x.fillStyle = b[2]; roundRect(x, 300, y - 12, 560 * clamp(b[1], 0, 100) / 100, 26, 13); x.fill();
    x.fillStyle = "#4a2b35"; x.fillText(String(Math.round(b[1])), 900, y + 12);
  });
  x.textAlign = "center"; x.fillStyle = "#a98492"; x.font = "28px sans-serif";
  x.fillText("截个图，@ 一个正在考研的人", 540, 1350);
  var url;
  try { url = c.toDataURL("image/png"); } catch(e){ return; }
  var img = document.createElement("img");
  img.src = url; img.style.display = "block"; img.style.width = "100%"; img.style.borderRadius = "14px"; img.style.marginTop = "10px";
  document.querySelector(".card").appendChild(img);
  img.scrollIntoView({block:"center"});
}
function roundRect(x, a, b, w, h2, r){
  x.beginPath();
  x.moveTo(a + r, b);
  x.arcTo(a + w, b, a + w, b + h2, r);
  x.arcTo(a + w, b + h2, a, b + h2, r);
  x.arcTo(a, b + h2, a, b, r);
  x.arcTo(a, b, a + w, b, r);
  x.closePath();
}
function wrapText(x, text, cx, y, maxW, lh){
  var line = "", yy = y;
  for (var i = 0; i < text.length; i++){
    var t = line + text[i];
    if (x.measureText(t).width > maxW){ x.fillText(line, cx, yy); line = text[i]; yy += lh; }
    else line = t;
  }
  if (line) x.fillText(line, cx, yy);
}

renderIntro();
</script>
