/* ================== 考研英语上岸模拟器 · demo v1 ==================
   概念：东舟路线「流量优先」——马斯克/班主任式剧情模拟器 × 考研。
   开局定命 → 30+ 张事件卡（毒舌日常 + 考研英语词根题彩蛋）→
   四属性（心态/进度/头发/存款）→ 考试日估分 → 七种结局 → 分享图。
   英语题词根与考研母库同源（spect/dict/fer/dur…），玩着玩着背了单词。 */

var app = document.getElementById("app");
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

 {w:"interrupt", ph:"/ˌɪntəˈrʌpt/", o:["打断","休息","腐败","相互"], a:0, tip:"rupt＝破裂。inter（中间）→ 从中间破开＝「打断」。interrupt the silence。"},
 {w:"inspire", ph:"/ɪnˈspaɪə/", o:["鼓舞；启发","呼吸","出汗","渴望"], a:0, tip:"spir＝呼吸。in（吸进）→ 把气吹进去＝「鼓舞」。be inspired by＝受…启发。"},
 {w:"prevent", ph:"/prɪˈvent/", o:["阻止","发明","事件","走向"], a:0, tip:"vent＝来。pre（提前）→ 提前赶到＝「阻止」。prevent…from doing＝阻止做某事。"},
 {w:"insist", ph:"/ɪnˈsɪst/", o:["坚持说；坚决要求","存在","抵抗","站立"], a:0, tip:"sist＝站。in（上面）→ 站在原地不动＝「坚持」。insist on＝坚决要求。"},
 {w:"betray", ph:"/bɪˈtreɪ/", o:["背叛；泄露","燃烧","运送","预言"], a:0, tip:"tray＝交付 → 把秘密交出去＝「背叛」。betray one's trust＝辜负信任。"},

/* ---------- 开局定命 ---------- */
var GOALS = [
 {l:"🎯 冲名校（清北复交档）", line:390, name:"名校冲锋型", tag:"初试线 390"},
 {l:"🏫 稳 985 / 211", line:360, name:"稳妥上岸型", tag:"初试线 360"},
 {l:"🌱 双非逆袭", line:330, name:"逆袭剧本型", tag:"初试线 330"}
];
var HOURS = [
 {l:"🌙 佛系三小时", v:"佛系选手", desc:"学是学了，没完全学"},
 {l:"⏰ 常规六小时", v:"规律型选手", desc:"图书馆钉子户"},
 {l:"🔥 卷王九小时", v:"卷王本王", desc:"图书馆闭馆音乐都认得你"}
];
var PHONE = [
 {l:"🌲 装了专注 APP", v:"自律装机版", desc:"Forest 树都种成森林了"},
 {l:"📵 半机半学", v:"半卷半躺版", desc:"学一小时，刷半小时"},
 {l:"🤳 刷到停不下来", v:"重度网瘾版", desc:"『考研来得及吗』专业十级学者"}
];

/* ---------- 状态 ---------- */
var S = {stage:"intro", goal:0, hours:1, phone:1, st:{x:70,p:10,h:100,m:100}, round:0, right:0, wrong:0, queue:[], hist:[], pick:0};

var MONTHS = ["3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
var TOTAL = 31;   // 第 0~29 轮事件 + 考试日(第30)

function monthOf(r){
  var idx = Math.min(9, Math.floor(r / TOTAL * 9.4));
  return MONTHS[idx];
}

/* ---------- 渲染 ---------- */
function header(month){
  return '<div class="top"><div><div class="t1">考研英语上岸模拟器</div><div class="t2">' + esc(month) + ' · 你的考研命运行中</div></div><div class="pill">第 ' + (S.round + 1) + " / " + TOTAL + " 天</div></div>";
}
function bars(){
  var s = S.st;
  function bar(name, v, c){
    return '<div class="stbar"><div class="stl"><b>' + name + "</b><span>" + Math.round(v) + "</span></div><div class=\"bar\"><i style=\"width:" + clamp(v,0,100) + "%;background:" + c + '"></i></div></div>';
  }
  return bar("🙂 心态", s.x, "#e8a33d") + bar("📈 进度", s.p, "#c2708c") + bar("💇 头发", s.h, "#7f8fb5") + bar("💰 存款", s.m, "#5da27a");
}
function deltaHTML(f){
  var map = {x:"心态", p:"进度", h:"头发", m:"存款"};
  var out = "";
  for (var k in f){ if (k === "quit") continue;
    var v = f[k]; if (!v) continue;
    out += '<span class="delta ' + (v > 0 ? "up" : "down") + '">' + map[k] + (v > 0 ? "+" : "") + v + "</span> ";
  }
  return out;
}
function applyF(f){
  if (f.quit) return;
  S.st.x = clamp(S.st.x + (f.x || 0), 0, 100);
  S.st.p = clamp(S.st.p + (f.p || 0), 0, 100);
  S.st.h = clamp(S.st.h + (f.h || 0), 0, 100);
  S.st.m = clamp(S.st.m + (f.m || 0), 0, 100);
}

function renderIntro(){
  var plays = 0;
  try { plays = Number(localStorage.getItem("ksim_plays") || 0); } catch(e){}
  var h = '<div class="top"><div><div class="t1">考研英语上岸模拟器</div><div class="t2">H5 · 免安装 · 玩一遍你的一年</div></div><div class="pill">demo</div></div>';
  h += '<div class="card"><div class="emoji-big">🎓</div>';
  h += '<div class="endt">考研英语上岸模拟器</div>';
  h += '<div class="fate">用 5 分钟，过一遍你的考研一年。<br>定一个命，抽 30 张卡，走到 12 月的考场。<br>考的是英语，玩的是心跳。</div>';
  if (plays > 0) h += '<div style="text-align:center;font-size:12px;color:#8a6470">你已经重开 ' + plays + " 次了。这次能上岸吗？</div>";
  h += '<div style="margin-top:12px"><button class="btn" id="go">开始 · 生成我的考研命</button></div></div>';
  h += '<div class="foot">四条命：心态 / 进度 / 头发 / 存款<br>走到考场算总分，也能中途「提前退场」<br>考研英语真题词根已混入卡池，答错送讲解</div>';
  app.innerHTML = h;
  document.getElementById("go").onclick = function(){ S.stage = "setup"; S.pick = 0; renderSetup(); };
}

function renderSetup(){
  var h = '<div class="top"><div><div class="t1">生成考研命</div><div class="t2">三个选择，决定你这一年的命格</div></div><div class="pill">定命</div></div>';
  h += '<div class="card"><div class="ev">① 目标院校</div>';
  for (var i=0;i<GOALS.length;i++) h += optBtn("g", i, GOALS[i].l, S.goal === i);
  h += "</div>";
  h += '<div class="card"><div class="ev">② 每天学多久</div>';
  for (i=0;i<HOURS.length;i++) h += optBtn("h", i, HOURS[i].l, S.hours === i);
  h += "</div>";
  h += '<div class="card"><div class="ev">③ 手机自制力</div>';
  for (i=0;i<PHONE.length;i++) h += optBtn("p", i, PHONE[i].l, S.phone === i);
  h += "</div>";
  h += '<button class="btn" id="born">🎯 我的考研命，就这样定了</button>';
  h += '<div class="foot">命格会影响结局门槛、事件伤害和考试估分——不服就重开</div>';
  app.innerHTML = h;
  app.querySelectorAll("[data-gp]").forEach(function(b){
    b.onclick = function(){
      var k = b.getAttribute("data-gp"), v = Number(b.getAttribute("data-v"));
      if (k === "g") S.goal = v; else if (k === "h") S.hours = v; else S.phone = v;
      renderSetup();
    };
  });
  document.getElementById("born").onclick = function(){
    S.st = {x:70, p:10, h:100, m:100};
    if (S.hours === 2){ S.st.p += 6; S.st.h -= 8; }
    if (S.hours === 0){ S.st.p -= 4; S.st.x += 5; }
    if (S.phone === 2){ S.st.x -= 6; }
    if (S.phone === 0){ S.st.x += 4; }
    buildQueue();
    S.round = 0; S.right = 0; S.wrong = 0; S.hist = [];
    S.stage = "run";
    renderCard();
  };
}
function optBtn(k, v, label, on){
  return '<button class="opt" data-gp="' + k + '" data-v="' + v + '" style="' + (on ? "border-color:#c2708c;background:#fbeef2;font-weight:700" : "") + '">' + label + (on ? " ✓" : "") + "</button>";
}

function buildQueue(){
  var g = shuffle(EVENTS.slice()), q = shuffle(ENQ.slice()), fix = FIX.slice();
  var gi = 0, ei = 0;
  S.queue = [];
  for (var r = 0; r < TOTAL; r++){
    if (fix.length && r === fix[0].r){ S.queue.push({ ev: fix.shift(), fix: 1 }); continue; }
    var useEn;
    if (ei >= q.length) useEn = false;
    else if (gi >= g.length) useEn = true;
    else useEn = (r % 2 === 1);      // 奇数轮塞英语题，让题量稳定
    if (useEn){ S.queue.push({en:q[ei]}); ei++; } else { S.queue.push({ev:g[gi]}); gi++; }
  }
}

function renderCard(){
  if (S.round >= TOTAL){ return renderExam(); }
  var item = S.queue[S.round];
  var h = header(monthOf(S.round));
  h += '<div class="card">' + bars() + "</div>";
  if (item.en){
    var q = item.en;
    item.ord = shuffle([0,1,2,3]);          // 选项每局洗牌，正确项位置不可预测
    h += '<div class="card"><span class="tag">考研英语 · 词根题</span><span class="tag">答对加心态和进度</span>';
    h += '<div style="margin-top:10px"><div class="qw">' + q.w + '</div><div class="ph">' + q.ph + " —— 考研阅读里，它是啥意思？</div></div>";
    h += '<div style="margin-top:12px">';
    for (var i=0;i<item.ord.length;i++) h += '<button class="opt" data-q="' + i + '">' + esc(q.o[item.ord[i]]) + "</button>";
    h += "</div></div>";
  } else {
    var ev = item.ev;
    h += '<div class="card"><span class="tag">' + esc(monthOf(S.round)) + " 事件</span>";
    h += '<div class="ev" style="margin-top:8px">' + esc(ev.e) + '</div><div class="desc">' + esc(ev.d) + "</div>";
    for (var j=0;j<ev.c.length;j++) h += '<button class="opt" data-c="' + j + '">' + esc(ev.c[j].l) + "</button>";
    h += "</div>";
  }
  h += '<div class="foot">心态归零 / 头发掉光 / 存款花完 → 提前退场</div>';
  app.innerHTML = h;
  app.querySelectorAll("[data-q]").forEach(function(b){ b.onclick = function(){ answerEn(Number(b.getAttribute("data-q"))); }; });
  app.querySelectorAll("[data-c]").forEach(function(b){ b.onclick = function(){ pickEv(Number(b.getAttribute("data-c"))); }; });
}

function answerEn(i){
  var item = S.queue[S.round], q = item.en, ok = (i === item.ord.indexOf(q.a));
  var h = header(monthOf(S.round)) + '<div class="card">' + bars() + "</div>";
  h += '<div class="card"><span class="tag">考研英语 · 词根题</span>';
  h += '<div style="margin-top:10px"><div class="qw">' + q.w + '</div><div class="ph">' + q.ph + "</div></div>";
  h += '<div style="margin-top:10px" class="res">' + (ok ? "✅ 答对了！" : "❌ 答错了（正确答案：" + esc(q.o[q.a]) + "）") + deltaHTML(ok ? {x:4,p:3} : {x:-4}) + "</div>";
  h += '<div class="res" style="background:#f4f7fb">💡 ' + esc(q.tip) + "</div>";
  applyF(ok ? {x:4,p:3} : {x:-4});
  if (ok) S.right++; else S.wrong++;
  h += nextBtn();
  app.innerHTML = h;
  bindNext();
}

function pickEv(ci){
  var ev = S.queue[S.round].ev, ch = ev.c[ci];
  if (ch.f.quit) return renderQuit();
  var h = header(monthOf(S.round)) + '<div class="card">' + bars() + "</div>";
  h += '<div class="card"><span class="tag">' + esc(monthOf(S.round)) + " 事件</span>";
  h += '<div class="ev" style="margin-top:8px">' + esc(ev.e) + "</div>";
  h += '<div style="margin-top:10px" class="res">' + esc(ch.r) + deltaHTML(ch.f) + "</div>";
  applyF(ch.f);
  S.hist.push(ev.e);
  h += nextBtn();
  app.innerHTML = h;
  bindNext();
}

function nextBtn(){ return '<div style="margin-top:4px"><button class="btn" id="nx">' + (S.round + 1 >= TOTAL ? "🎫 走，进考场" : "继续 → 第 " + (S.round + 2) + " 天") + "</button></div>"; }
function bindNext(){
  document.getElementById("nx").onclick = function(){
    var dead = checkDead();
    if (dead) return renderDead(dead);
    S.round++;
    renderCard();
  };
}
function checkDead(){
  if (S.st.x <= 0) return {e:"😵‍💫", t:"心态崩了", d:"你在自习室哭了三次之后，收拾东西回家了。12 月的考场，你缺席了。"};
  if (S.st.h <= 0) return {e:"🧑‍🦲", t:"头发掉光了", d:"梳子上再也没有头发可掉。医生建议：先养身体，明年再战。"};
  if (S.st.m <= 0) return {e:"💸", t:"存款花完了", d:"资料、辅导班、688 的酒店……钱包先于梦想破产。你含泪签了份工作。"};
  return null;
}

function renderQuit(){
  finishPlay();
  renderEnd({e:"💼", t:"提前就业结局", d:"你签了 offer，删除了背单词 APP，世界突然安静了。<br>工位上，你刷到有人晒拟录取通知——愣了三秒，然后继续改方案。", quit:1});
}

function renderDead(d){
  finishPlay();
  renderEnd(d);
}

/* ---------- 考试日 ---------- */
function renderExam(){
  var g = GOALS[S.goal];
  var eng = clamp(Math.round(35 + S.st.p * 0.45 + S.right * 1.8 + (S.phone === 0 ? 2 : 0)), 22, 92);
  var pol = clamp(Math.round(58 + S.st.x * 0.18), 50, 78);
  var pro = clamp(Math.round(92 + S.st.p * 0.32), 92, 128);
  var total = eng + pol + pro;
  S.exam = {eng:eng, pol:pol, pro:pro, total:total};
  var h = header("12月 · 考试日");
  h += '<div class="card"><div class="emoji-big">🎫</div><div class="endt">考 试 日</div>';
  h += '<div class="fate">第一科：英语。监考老师把你那 P 过的照片看了两眼。<br>交卷铃响的那一刻，你的考研一年结束了。</div>';
  h += '<div class="score"><div class="sc"><b>' + eng + "</b><span>英语</span></div><div class=\"sc\"><b>" + pol + "</b><span>政治</span></div><div class=\"sc\"><b>" + pro + "</b><span>专业课</span></div><div class=\"sc\"><b style=\"color:#c2708c\">" + total + "</b><span>总分</span></div></div>";
  h += '<div style="text-align:center;font-size:12.5px;color:#8a6470">目标线 ' + g.line + " · 词根题答对 " + S.right + " / " + (S.right + S.wrong) + "</div>";
  h += '<div style="margin-top:14px"><button class="btn" id="fin">查分 →</button></div></div>';
  h += '<div class="foot">估分模型：进度 + 词根题答对数 + 命格修正（demo 仅供娱乐）</div>';
  app.innerHTML = h;
  document.getElementById("fin").onclick = function(){ renderScore(total, g); };
}

function renderScore(total, g){
  var end;
  if (total >= g.line + 2) end = {e:"🎉", t:"上岸了", d:"拟录取三个字，比这十一个月所有单词都好看。<br>你给妈妈打电话，第一句是：『妈，你女儿/儿子要读研了。』"};
  else if (total >= g.line - 14) end = {e:"🥲", t:"擦线，调剂", d:"差一点点。调剂系统你填了 37 所学校，<br>最后去了一所你查地图才知道在哪的大学。"};
  else end = {e:"🔁", t:"二战吧", d:"差 " + (g.line - total) + " 分。『二战』两个字写起来很快，<br>读起来，又是三百天。"};
  finishPlay();
  renderEnd(end);
}

/* ---------- 结局 ---------- */
function finishPlay(){
  try {
    var n = Number(localStorage.getItem("ksim_plays") || 0) + 1;
    localStorage.setItem("ksim_plays", String(n));
  } catch(e){}
}

function renderEnd(end){
  var g = GOALS[S.goal];
  var fate = g.name + " · " + HOURS[S.hours].v + " · " + PHONE[S.phone].v;
  var h = '<div class="top"><div><div class="t1">结局</div><div class="t2">你的考研命 · 已结算</div></div><div class="pill">第 ' + (S.round + 1) + " 天</div></div>";
  h += '<div class="card"><div class="emoji-big">' + end.e + '</div><div class="endt">' + esc(end.t) + "</div>";
  h += '<div class="fate">' + end.d + "</div>";
  h += '<div style="text-align:center;margin:4px 0 10px"><span class="tag">' + esc(g.l) + "</span><span class=\"tag\">" + fate + "</span></div>";
  h += bars();
  if (!end.quit) h += '<div style="text-align:center;font-size:12.5px;color:#8a6470;margin-top:8px">英语估分 ' + S.exam.eng + " · 词根题答对 " + S.right + " / " + (S.right + S.wrong) + "</div>";
  h += '<div style="margin-top:14px"><button class="btn" id="share">📸 生成分享图</button></div>';

  if (S.hist.length) h += '<div class="card"><div style="font-size:13px;font-weight:700;margin-bottom:6px">你这一年的名场面</div><div style="font-size:12.5px;color:#8a6470;line-height:1.9">' + S.hist.slice(-5).map(esc).join("<br>") + "</div></div>";
  h += '<div class="foot">考研英语上岸模拟器 · demo<br>重开一局，事件和词根题都会换</div>';
  app.innerHTML = h;
  document.getElementById("again").onclick = function(){ S.stage = "setup"; S.pick = 0; renderSetup(); };
  document.getElementById("home2").onclick = renderIntro;
  document.getElementById("share").onclick = function(){ drawShare(end, fate); };
}

/* ---------- 分享图（canvas 1080×1440，长按保存） ---------- */
function drawShare(end, fate){
  var c = document.createElement("canvas");
  c.width = 1080; c.height = 1440;
  var x = c.getContext("2d");
  if (!x) return;
  x.fillStyle = "#EDD1D8"; x.fillRect(0, 0, 1080, 1440);
  x.fillStyle = "#ffffff"; roundRect(x, 60, 120, 960, 1200, 40); x.fill();
  x.fillStyle = "#c2708c"; x.font = "bold 54px KaiTi, serif"; x.textAlign = "center";
  x.fillText("考研英语上岸模拟器", 540, 250);
  x.fillStyle = "#8a6470"; x.font = "30px sans-serif";
  x.fillText("你的考研命 · 已结算", 540, 310);
  x.font = "150px serif"; x.fillText(end.e, 540, 480);
  x.fillStyle = "#4a2b35"; x.font = "bold 88px KaiTi, serif";
  x.fillText(end.t, 540, 640);
  x.fillStyle = "#5d414b"; x.font = "34px sans-serif";
  wrapText(x, end.d.replace(/<br>/g, " "), 540, 720, 860, 50);
  x.fillStyle = "#fbeef2"; roundRect(x, 140, 860, 800, 150, 30); x.fill();
  x.fillStyle = "#c2708c"; x.font = "bold 36px sans-serif";
  x.fillText(fate, 540, 930);
  if (!end.quit && S.exam) x.fillText("英语估分 " + S.exam.eng + " · 词根题答对 " + S.right + " 题", 540, 985);
  var s = S.st, bars = [["心态", s.x, "#e8a33d"], ["进度", s.p, "#c2708c"], ["头发", s.h, "#7f8fb5"], ["存款", s.m, "#5da27a"]];
  bars.forEach(function(b, i){
    var y = 1090 + i * 62;
    x.textAlign = "left"; x.fillStyle = "#8a6470"; x.font = "30px sans-serif";
    x.fillText(b[0], 180, y + 12);
    x.fillStyle = "#f6e7ec"; roundRect(x, 300, y - 12, 560, 26, 13); x.fill();
    x.fillStyle = b[2]; roundRect(x, 300, y - 12, 560 * clamp(b[1], 0, 100) / 100, 26, 13); x.fill();
    x.fillStyle = "#4a2b35"; x.fillText(String(Math.round(b[1])), 900, y + 12);
  });
  x.textAlign = "center"; x.fillStyle = "#a98492"; x.font = "28px sans-serif";
  x.fillText("截个图，@ 一个正在考研的人", 540, 1350);
  var url;
  try { url = c.toDataURL("image/png"); } catch(e){ return; }
  var img = document.createElement("img");
  img.src = url; img.style.display = "block"; img.style.width = "100%"; img.style.borderRadius = "14px"; img.style.marginTop = "10px";
  document.querySelector(".card").appendChild(img);
  img.scrollIntoView({block:"center"});
}
function roundRect(x, a, b, w, h2, r){
  x.beginPath();
  x.moveTo(a + r, b);
  x.arcTo(a + w, b, a + w, b + h2, r);
  x.arcTo(a + w, b + h2, a, b + h2, r);
  x.arcTo(a, b + h2, a, b, r);
  x.arcTo(a, b, a + w, b, r);
  x.closePath();
}
function wrapText(x, text, cx, y, maxW, lh){
  var line = "", yy = y;
  for (var i = 0; i < text.length; i++){
    var t = line + text[i];
    if (x.measureText(t).width > maxW){ x.fillText(line, cx, yy); line = text[i]; yy += lh; }
    else line = t;
  }
  if (line) x.fillText(line, cx, yy);
}
